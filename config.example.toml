# Copy to config.toml and adjust. config.toml is gitignored.

[camera]
# The camera's address on the local network
ip = "192.0.2.10"
# Name as it appears on the camera's display during registration
device_name = "lumix-remote"

[stream]
# Local UDP port the camera sends the frames to
port = 49199

[events]
# Local TCP port the camera reports its events to; 0 switches them off
port = 49198
# Address the camera reports to, if not this machine's own (behind NAT)
host = ""

[media]
# Folder for files downloaded from the camera's cards. Empty: no download.
download_dir = ""

[web]
# Where the web interface listens
host = "127.0.0.1"
port = 8080
# Host names besides IP addresses, single words and *.local, e.g. a reverse proxy's
allowed_hosts = []
