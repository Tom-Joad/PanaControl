# Tests every push and builds the image only for v* tags and manual runs.
# The image inherits the repository's visibility: public, so pulling it
# needs no login.

name: Build and push image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Spelled out rather than derived from the repository name: GHCR requires
  # lower case.
  IMAGE: ghcr.io/tom-joad/panacontrol

# Actions are pinned to commit SHAs, not tags: a tag can be moved. The
# comment after each names the release.
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action reads a pull request's commits through the API;
      # without this permission every pull request fails.
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks needs the history

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14" # as in the image

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Compile and import
        run: |
          python -m compileall -q lumixremote
          python -c "import lumixremote.app, lumixremote.probe"

      - name: Unit tests
        run: python -m pytest -q

      - name: Scan dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off --requirement requirements.txt

      - name: Shellcheck
        run: shellcheck root/etc/s6-overlay/s6-rc.d/*/run tests/smoke.sh

      - name: Unraid template
        run: python3 -c "import xml.dom.minidom as m; m.parse('unraid/PanaControl.xml')"

      - name: Build the image
        run: docker build --tag panacontrol:test .

      - name: Smoke test
        run: tests/smoke.sh panacontrol:test

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    # Nothing reaches the registry before all checks are green, and only for
    # tags and manual runs.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signature through the run's OIDC token
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            # A manual run from a branch other than main publishes a test
            # image as "dev"; latest and the version tags stay untouched.
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # amd64 only: the app runs on an x86-64 Unraid server; no ARM
          # host is in use.
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan the built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0" # report only: a new CVE in the base image must not hold up a fix

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The digest is signed, not the tag: tags move, the digest doesn't.
      - name: Sign image (keyless, GitHub OIDC)
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
